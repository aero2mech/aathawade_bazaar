name: Build & Release APK and IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShetkariBazaar-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ShetkariBazaar.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShetkariBazaar-iOS-IPA
          path: ShetkariBazaar.ipa

  create-github-release:
    name: Publish Direct Download Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Shetkari Athawade Bazaar v1.0.${{ github.run_number }}"
          body: "Download the latest Android APK or iOS IPA directly below."
          files: |
            artifacts/ShetkariBazaar-Android-APK/app-release.apk
            artifacts/ShetkariBazaar-iOS-IPA/ShetkariBazaar.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}